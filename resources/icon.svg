<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="win">
      <rect x="8" y="8" width="240" height="240" rx="28" ry="28"/>
    </clipPath>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="crt" cx="30%" cy="78%" r="75%">
      <stop offset="0%" stop-color="#123322" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0b0f14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="28" ry="28" fill="#0b0f14" stroke="#2a323d" stroke-width="3"/>

  <g clip-path="url(#win)">
    <rect x="8" y="8" width="240" height="240" fill="url(#crt)"/>

    <rect x="8" y="8" width="240" height="34" fill="#12171f"/>
    <line x1="8" y1="42" x2="248" y2="42" stroke="#232b36" stroke-width="1.5"/>
    <circle cx="34" cy="25" r="6" fill="#ff5f56"/>
    <circle cx="54" cy="25" r="6" fill="#ffbd2e"/>
    <circle cx="74" cy="25" r="6" fill="#27c93f"/>

    <g font-family="'JetBrains Mono','Courier New',monospace" fill="#39ff88">
      <text x="28" y="70" font-size="13" opacity="0.14">*</text>
      <text x="196" y="60" font-size="16" opacity="0.16">*</text>
      <text x="212" y="98" font-size="10" opacity="0.12">*</text>
      <text x="150" y="55" font-size="10" opacity="0.14">*</text>
      <text x="46" y="120" font-size="11" opacity="0.12">*</text>
      <text x="222" y="150" font-size="13" opacity="0.15">*</text>
      <text x="30" y="170" font-size="10" opacity="0.12">*</text>
      <text x="180" y="200" font-size="10" opacity="0.10">*</text>
      <text x="70" y="90" font-size="9" opacity="0.10">*</text>
    </g>

    <g transform="translate(148,128) rotate(-34) scale(1.65)" filter="url(#glow)">
      <polygon points="50,0 20,-4 -40,-3 -46,0 -40,3 20,4" fill="#ffc94d"/>
      <polygon points="-46,0 -58,-7 -58,7" fill="#ffc94d"/>
      <polygon points="8,-3 -38,-46 -30,-8" fill="#ffc94d"/>
      <polygon points="8,3 -38,46 -30,8" fill="#d99a1f"/>
      <polygon points="-30,-3 -48,-18 -42,-2" fill="#ffc94d"/>
      <polygon points="-30,3 -48,18 -42,2" fill="#d99a1f"/>
    </g>
  </g>

  <rect x="8" y="8" width="240" height="240" rx="28" ry="28" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="1"/>
</svg>
